<title>GrowNest has moved</title>
<script>
  // GrowNest now lives inside Nestopia. Send every old address (including feedback links in emails) to the same page there.

    var page = location.pathname.replace(/^\/+/, "").replace(/^grownest\//, "");
    location.replace("https://nestopia.school/grownest/" + page + location.search + location.hash);
  })();
</script>
