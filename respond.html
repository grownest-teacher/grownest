<!DOCTYPE html><html lang="en-GB"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><link rel="icon" href="favicon.png"><link rel="apple-touch-icon" href="favicon.png"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="style.css?v=20261108j"><title>Your feedback · GrowNest</title></head><body>
<header class="top"><div class="wrap"><a href="index.html"><img src="logo-header.png" alt="GrowNest"></a></div></header>
<main class="wrap"><div class="card narrow" id="box">
 <h1>Thank you for the feedback</h1>
 <p class="muted">Please confirm your choice below.</p>
 <button class="choice" data-c="meeting_requested"><b>I would like a meeting</b><br><span class="muted">Thank you for the feedback. I would like a meeting to discuss it.</span></button>
 <button class="choice" data-c="no_meeting"><b>I don’t need a meeting</b><br><span class="muted">Thank you for the feedback. I don’t need a meeting.</span></button>
 <div id="msg" class="msg hide" role="status"></div>
 <button class="btn primary" id="confirm" style="width:100%;margin-top:8px" disabled>Confirm</button>
</div></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script><script src="gn.js?v=20261108j"></script>
<script>
const q=new URLSearchParams(location.search);const token=q.get("t");let choice=q.get("c");
const pick=c=>{choice=c;document.querySelectorAll(".choice").forEach(b=>b.setAttribute("aria-pressed",b.dataset.c===c));$("confirm").disabled=!c;};
document.querySelectorAll(".choice").forEach(b=>b.onclick=()=>pick(b.dataset.c));
if(choice)pick(choice);
if(!token){showMsg($("msg"),"This link is incomplete. Please use the button in your feedback email.","err");$("confirm").disabled=true;}
$("confirm").onclick=async()=>{$("confirm").disabled=true;
 const {data,error}=await sb.rpc("record_teacher_response",{p_token:token,p_choice:choice});
 if(error){$("confirm").disabled=false;return showMsg($("msg"),"Sorry, this link isn’t valid any more. Please reply to the feedback email instead.","err");}
 sb.functions.invoke("grownest-mail",{body:{action:"response",token}}).catch(()=>{});
 const txt=data.response==="meeting_requested"?"Your observer will contact you to arrange a meeting.":"Your response has been recorded.";
 $("box").innerHTML="<h1>Thank you"+(data.teacher?", "+esc(data.teacher.split(" ")[0]):"")+"</h1><p>"+txt+"</p><p class='muted'>"+esc(data.school||"")+"</p>";};</script>
</body></html>
