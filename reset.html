<!DOCTYPE html><html lang="en-GB"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><link rel="icon" href="favicon.png"><link rel="apple-touch-icon" href="favicon.png"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="style.css?v=20261108g"><title>New password · GrowNest</title></head><body>
<header class="top"><div class="wrap"><a href="index.html"><img src="logo-header.png" alt="GrowNest"></a></div></header>
<main class="wrap"><div class="card narrow"><h1>Choose a new password</h1>
 <form id="form" novalidate><label class="f">New password (at least 8 characters)<input id="password" type="password" autocomplete="new-password"></label>
 <div id="msg" class="msg hide" role="status"></div><button class="btn primary" style="width:100%">Save password</button></form></div></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script><script src="gn.js?v=20261108g"></script>
<script>
$("form").addEventListener("submit",async e=>{e.preventDefault();const m=$("msg");const p=$("password").value;
 if(p.length<8)return showMsg(m,"Please use at least 8 characters.","err");
 const {error}=await sb.auth.updateUser({password:p});
 if(error)return showMsg(m,friendly(error),"err");showMsg(m,"Password saved. Taking you to GrowNest…","ok");setTimeout(()=>location.href="app.html",1200);});</script>
</body></html>
