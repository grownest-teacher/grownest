<!DOCTYPE html><html lang="en-GB"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><link rel="icon" href="favicon.png"><link rel="apple-touch-icon" href="favicon.png"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="style.css?v=20261108j"><title>Register · GrowNest</title></head><body>
<header class="top"><div class="wrap"><a href="index.html"><img src="logo-header.png" alt="GrowNest"></a><a class="btn ghost small" href="login.html">Sign in</a></div></header>
<main class="wrap"><div class="card narrow">
 <h1>Join GrowNest</h1>
 <div class="tabs" role="tablist"><button type="button" id="tabNew" aria-selected="true">Register a new school</button><button type="button" id="tabJoin" aria-selected="false">Join my school</button></div>
 <form id="form" novalidate>
  <div id="newFields">
   <label class="f">School name<input id="schoolName" autocomplete="organization"></label>
   <label class="f">Emirate<select id="emirate"><option value="">Choose…</option><option>Abu Dhabi</option><option>Dubai</option><option>Sharjah</option><option>Ajman</option><option>Umm Al Quwain</option><option>Ras Al Khaimah</option><option>Fujairah</option></select></label>
  </div>
  <div id="joinFields" class="hide"><label class="f">School code<input id="joinCode" placeholder="8-letter code from your school admin" autocapitalize="characters"></label></div>
  <label class="f">Your full name<input id="fullName" autocomplete="name"></label>
  <label class="f">Job title<input id="jobTitle" placeholder="e.g. Assistant Principal"></label>
  <label class="f">Work email<input id="email" type="email" autocomplete="email" inputmode="email"></label>
  <label class="f">Password (at least 8 characters)<input id="password" type="password" autocomplete="new-password"></label>
  <div id="msg" class="msg hide" role="status"></div>
  <button class="btn primary" id="submit" style="width:100%">Create account</button>
 </form>
 <p class="muted" style="margin-top:16px">Teachers don’t need an account. Only observers and school leaders sign in.</p>
</div></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script><script src="gn.js?v=20261108j"></script>
<script>
let mode="new";
function setMode(m){mode=m;$("tabNew").setAttribute("aria-selected",m==="new");$("tabJoin").setAttribute("aria-selected",m==="join");
 $("newFields").classList.toggle("hide",m!=="new");$("joinFields").classList.toggle("hide",m!=="join");}
$("tabNew").onclick=()=>setMode("new");$("tabJoin").onclick=()=>setMode("join");
$("form").addEventListener("submit",async e=>{e.preventDefault();const m=$("msg");
 const d={mode,school_name:$("schoolName").value.trim(),emirate:$("emirate").value,join_code:$("joinCode").value.trim().toUpperCase(),full_name:$("fullName").value.trim(),job_title:$("jobTitle").value.trim()};
 const email=$("email").value.trim(),password=$("password").value;
 if(mode==="new"&&(!d.school_name||!d.emirate))return showMsg(m,"Please enter your school name and emirate.","err");
 if(mode==="join"&&d.join_code.length<6)return showMsg(m,"Please enter the school code from your school admin.","err");
 if(!d.full_name||!email||password.length<8)return showMsg(m,"Please fill in your name, email and a password of at least 8 characters.","err");
 $("submit").disabled=true;showMsg(m,"Creating your account…","info");
 const {data,error}=await sb.auth.signUp({email,password,options:{data:d,emailRedirectTo:SITE+"app.html"}});
 $("submit").disabled=false;
 if(error)return showMsg(m,friendly(error),"err");
 if(data.session){location.href="app.html";return;}
 $("form").reset();showMsg(m,"Almost done! We’ve sent a confirmation link to "+email+". Open it to finish setting up your account.","ok");
});</script>
</body></html>
