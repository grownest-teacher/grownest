<!DOCTYPE html><html lang="en-GB"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><link rel="icon" href="favicon.png"><link rel="apple-touch-icon" href="favicon.png"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="style.css?v=20261108h"><title>Sign in · GrowNest</title></head><body>
<header class="top"><div class="wrap"><a href="index.html"><img src="logo-header.png" alt="GrowNest"></a><a class="btn ghost small" href="register.html">Register</a></div></header>
<main class="wrap"><div class="card narrow">
 <h1>Sign in</h1><p class="muted">For observers and school leaders.</p>
 <form id="form" novalidate>
  <label class="f">Email<input id="email" type="email" autocomplete="email" inputmode="email"></label>
  <label class="f">Password<input id="password" type="password" autocomplete="current-password"></label>
  <div id="msg" class="msg hide" role="status"></div>
  <button class="btn primary" id="submit" style="width:100%">Sign in</button>
 </form>
 <p style="margin-top:16px"><a href="#" id="forgot">Forgot your password?</a></p>
</div></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script><script src="gn.js?v=20261108h"></script>
<script>
sb.auth.getSession().then(({data})=>{if(data.session)location.href="app.html";});
$("form").addEventListener("submit",async e=>{e.preventDefault();const m=$("msg");$("submit").disabled=true;
 const {error}=await sb.auth.signInWithPassword({email:$("email").value.trim(),password:$("password").value});
 $("submit").disabled=false;if(error)return showMsg(m,friendly(error),"err");location.href="app.html";});
$("forgot").addEventListener("click",async e=>{e.preventDefault();const m=$("msg");const email=$("email").value.trim();
 if(!email)return showMsg(m,"Type your email above first, then tap “Forgot your password?” again.","info");
 const {error}=await sb.auth.resetPasswordForEmail(email,{redirectTo:SITE+"reset.html"});
 showMsg(m,error?friendly(error):"If that email has an account, we’ve sent a link to reset your password.",error?"err":"ok");});</script>
</body></html>
